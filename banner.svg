<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Malak, developer and UI/UX designer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <radialGradient id="glow" cx="78%" cy="45%" r="45%">
    <stop offset="0" stop-color="#e8a33d" stop-opacity=".34"/>
    <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
  </radialGradient>
  <style>
    .bar{fill:#05070f}
    .top{transform-box:fill-box;transform-origin:top;animation:openT 1.8s .3s cubic-bezier(.7,0,.2,1) both}
    .bot{transform-box:fill-box;transform-origin:bottom;animation:openT 1.8s .3s cubic-bezier(.7,0,.2,1) both}
    @keyframes openT{from{transform:scaleY(1)}to{transform:scaleY(.09)}}
    .l{font:900 190px Impact,"Arial Narrow Bold","Arial Narrow",sans-serif;fill:#ece5d6;text-anchor:middle;opacity:0;transform:translateY(70px);animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes rise{to{opacity:1;transform:none}}
    .tag{font:500 26px "Segoe UI",Helvetica,Arial,sans-serif;fill:#ece5d6;opacity:0;animation:fade 1s 2.4s forwards}
    .sub{font:400 18px "Segoe UI",Helvetica,Arial,sans-serif;fill:#9a9fb2;opacity:0;animation:fade 1s 2.8s forwards}
    .meta{font:500 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#9a9fb2;letter-spacing:2px;opacity:0;animation:fade 1s 3s forwards}
    @keyframes fade{to{opacity:1}}
    .glowc{animation:drift 9s ease-in-out infinite alternate}
    @keyframes drift{to{transform:translate(-40px,20px)}}
    .reel{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ring{fill:none;stroke:#e8a33d;stroke-width:2;opacity:.8}
    .hole{fill:#0f1426;stroke:#e8a33d;stroke-width:2}
    .line{stroke:#e8a33d;stroke-width:3;stroke-dasharray:140;stroke-dashoffset:140;animation:draw 1.2s 2.2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
  </style>
</defs>
<rect width="1200" height="400" fill="#0f1426"/>
<rect class="glowc" width="1200" height="400" fill="url(#glow)"/>
<g class="reel" opacity=".9">
  <g transform="translate(930 190)">
    <circle class="ring" r="120"/>
    <circle class="ring" r="30"/>
    <circle class="hole" cx="0" cy="-75" r="22"/>
    <circle class="hole" cx="65" cy="-37" r="22"/>
    <circle class="hole" cx="65" cy="37" r="22"/>
    <circle class="hole" cx="0" cy="75" r="22"/>
    <circle class="hole" cx="-65" cy="37" r="22"/>
    <circle class="hole" cx="-65" cy="-37" r="22"/>
  </g>
</g>
<text class="l" x="150" y="245" style="animation-delay:1.5s">M</text>
<text class="l" x="275" y="245" style="animation-delay:1.6s">A</text>
<text class="l" x="395" y="245" style="animation-delay:1.7s">L</text>
<text class="l" x="510" y="245" style="animation-delay:1.8s">A</text>
<text class="l" x="640" y="245" style="animation-delay:1.9s">K</text>
<line class="line" x1="85" y1="272" x2="225" y2="272"/>
<text class="tag" x="85" y="312">Developer and UI/UX designer</text>
<text class="sub" x="85" y="342">Flutter, Spring Boot and interfaces that move.</text>
<rect class="bar top" width="1200" height="200"/>
<rect class="bar bot" y="200" width="1200" height="200"/>
<text class="meta" x="1115" y="390" text-anchor="end">ENI CARTHAGE, TUNISIA</text>
</svg>
