<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Malak Ben Othmen, software, AI, data and design"><style>text{font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
@keyframes fade{to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes glow{to{opacity:.55}}
.in{opacity:0;transform:translateY(8px);animation:fade 1s ease forwards}
.ln{stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.6s ease forwards}
.gl{animation:glow 5s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#0e2238"/></linearGradient>
<radialGradient id="r" cx="82%" cy="40%" r="40%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="240" rx="14" fill="url(#g)"/><rect class="gl" width="1200" height="240" rx="14" fill="url(#r)" opacity=".25"/>
<path class="ln" d="M0 210 C220 170 380 230 640 190 S1000 150 1200 175" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.5" style="animation-delay:.3s"/>
<circle cx="110" cy="112" r="52" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.5"/>
<text class="in" x="110" y="124" text-anchor="middle" font-size="34" font-weight="300" fill="#22d3ee" style="animation-delay:.2s">&lt;/&gt;</text>
<text class="in" x="200" y="124" font-size="58" font-weight="300" fill="#e6edf3" letter-spacing="1" style="animation-delay:.5s">malak<tspan fill="#22d3ee" font-weight="400">benothmen</tspan></text>
<text class="in" x="203" y="162" font-size="13" fill="#8b98a9" letter-spacing="5" style="animation-delay:1s">SOFTWARE   ·   AI   ·   DATA   ·   DESIGN</text>
<g font-family="Georgia,serif" font-style="italic" font-size="20" fill="#e6edf3" text-anchor="end">
<text class="in" x="1130" y="96" style="animation-delay:1.3s;opacity:0">Big dreams</text><text class="in" x="1130" y="124" style="animation-delay:1.5s">Clean code</text><text class="in" x="1130" y="152" style="animation-delay:1.7s">Real impact</text></g>
<line class="ln" x1="1010" y1="170" x2="1130" y2="170" stroke="#22d3ee" stroke-width="1.5" style="animation-delay:2s"/>
</svg>