<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Designing, building, shipping"><style>.h{font-family:Impact,"Arial Narrow Bold","Arial Narrow",sans-serif;font-weight:900;fill:#ece5d6}.s{font-family:"Segoe UI",Helvetica,Arial,sans-serif;fill:#9a9fb2}.a{fill:#e8a33d}
@keyframes fade{to{opacity:1}}@keyframes rise{to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sp{to{transform:translateX(28px)}}@keyframes bl{50%{opacity:.15}}@keyframes bob{to{transform:translateY(7px)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pls{to{transform:scale(1.18);opacity:.5}}
.in{opacity:0;animation:fade .9s forwards}.up{opacity:0;transform:translateY(40px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.ln{stroke:#e8a33d;stroke-width:3;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.1s forwards}
.rec{animation:bl 1.4s infinite}.spk{animation:sp 1.6s linear infinite}.bob{animation:bob .9s ease-in-out infinite alternate}
.sp{fill:#2a3150}.bx{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}@keyframes ph{0%{opacity:0;transform:translateY(14px)}6%{opacity:1;transform:none}30%{opacity:1;transform:none}36%{opacity:0;transform:translateY(-14px)}100%{opacity:0}}</style><text class="h" x="600" y="40" font-size="28" text-anchor="middle" style="opacity:0;animation:ph 9s 0s infinite;letter-spacing:1px">Designing interfaces people enjoy.</text><text class="h" x="600" y="40" font-size="28" text-anchor="middle" style="opacity:0;animation:ph 9s 3s infinite;letter-spacing:1px">Building backends that hold up.</text><text class="h" x="600" y="40" font-size="28" text-anchor="middle" style="opacity:0;animation:ph 9s 6s infinite;letter-spacing:1px">Shipping things that move.</text></svg>