.ln{stroke:#e8a33d;stroke-width:3;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.1s forwards}
.rec{animation:bl 1.4s infinite}.spk{animation:sp 1.6s linear infinite}.bob{animation:bob .9s ease-in-out infinite alternate}
.sp{fill:#2a3150}.bx{transform-box:fill-box;transform-origin:center}
