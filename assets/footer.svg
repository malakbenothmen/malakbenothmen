<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Let's build something together. Send an email."><style>text{font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
@keyframes fade{to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes glow{to{opacity:.55}}
.in{opacity:0;transform:translateY(8px);animation:fade 1s ease forwards}
.ln{stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.6s ease forwards}
.gl{animation:glow 5s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}</style>
<rect width="1200" height="110" rx="14" fill="#0a1020" stroke="#1c2a40"/>
<text class="in" x="600" y="52" text-anchor="middle" font-size="26" font-weight="300" fill="#e6edf3">Let's build something together.</text>
<line class="ln" x1="540" y1="66" x2="660" y2="66" stroke="#22d3ee" stroke-width="1.5" style="animation-delay:.8s"/>
<text class="in" x="600" y="92" text-anchor="middle" font-size="14" fill="#8b98a9" style="animation-delay:1s">Open to internships, freelance work and collaborations.</text></svg>