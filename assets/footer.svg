<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Let's make something."><style>.h{font-family:Impact,"Arial Narrow Bold","Arial Narrow",sans-serif;font-weight:900;fill:#ece5d6}.s{font-family:"Segoe UI",Helvetica,Arial,sans-serif;fill:#9a9fb2}.a{fill:#e8a33d}
@keyframes fade{to{opacity:1}}@keyframes rise{to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sp{to{transform:translateX(28px)}}@keyframes bl{50%{opacity:.15}}@keyframes bob{to{transform:translateY(7px)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pls{to{transform:scale(1.18);opacity:.5}}
.in{opacity:0;animation:fade .9s forwards}.up{opacity:0;transform:translateY(40px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.ln{stroke:#e8a33d;stroke-width:3;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.1s forwards}
.rec{animation:bl 1.4s infinite}.spk{animation:sp 1.6s linear infinite}.bob{animation:bob .9s ease-in-out infinite alternate}
.sp{fill:#2a3150}.bx{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}</style><rect width="1200" height="320" rx="14" fill="#0f1426" stroke="#2a3150"/><g transform="translate(1000 150)"><g class="bx" style="animation:spin 24s linear infinite"><circle r="82" fill="none" stroke="#e8a33d" stroke-width="2"/><circle r="20" fill="none" stroke="#e8a33d" stroke-width="2"/><circle cx="0" cy="-46" r="14" fill="#0f1426" stroke="#e8a33d" stroke-width="2"/><circle cx="40" cy="-23" r="14" fill="#0f1426" stroke="#e8a33d" stroke-width="2"/><circle cx="40" cy="23" r="14" fill="#0f1426" stroke="#e8a33d" stroke-width="2"/><circle cx="0" cy="46" r="14" fill="#0f1426" stroke="#e8a33d" stroke-width="2"/><circle cx="-40" cy="23" r="14" fill="#0f1426" stroke="#e8a33d" stroke-width="2"/><circle cx="-40" cy="-23" r="14" fill="#0f1426" stroke="#e8a33d" stroke-width="2"/></g></g><text class="h up" x="70" y="140" font-size="104" style="animation-delay:.2s">Let's make</text><text class="h up" x="70" y="238" font-size="104" style="animation-delay:.5s;fill:#e8a33d">something.</text><rect y="0" width="1200" height="30" fill="#05070f" rx="14"/><rect y="290" width="1200" height="30" fill="#05070f" rx="14"/><text class="s in" x="600" y="310" font-size="12" text-anchor="middle" style="animation-delay:1s;letter-spacing:2px">TUNISIA. OPEN TO INTERNSHIPS, FREELANCE AND COLLABORATIONS.</text></svg>